<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Test Page</title>
    <style>
        /* ทดสอบ CSS พื้นฐาน */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            max-width: 800px;
            margin: 0 auto;
            transition: background-color 0.3s, color 0.3s; 
        }
        /* ระบบ Dark Mode */
        body.dark-mode { 
            background-color: #1a1a1a; 
            color: #ffffff; 
        }
        .card { 
            border: 1px solid #ccc; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .dark-mode .card {
            border-color: #444;
            box-shadow: 0 4px 6px rgba(255,255,255,0.05);
        }
        button { 
            padding: 10px 20px; 
            cursor: pointer; 
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        button:hover { background-color: #0056b3; }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: calc(100% - 24px);
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>🧪 เว็บไซต์สำหรับทดสอบระบบ (Test Everything)</h1>
    <p>หน้านี้รวมการทดสอบพื้นฐานทั้งหมดสำหรับการพัฒนาเว็บ</p>

    <!-- ทดสอบ UI และ CSS Classes -->
    <div class="card">
        <h2>1. ทดสอบ UI & Dark Mode</h2>
        <button onclick="toggleDarkMode()">สลับโหมดมืด/สว่าง 🌙/☀️</button>
    </div>

    <!-- ทดสอบ JavaScript พื้นฐาน (State & Events) -->
    <div class="card">
        <h2>2. ทดสอบ JavaScript (Click Event)</h2>
        <button onclick="testClick()">คลิกฉันสิ!</button>
        <p id="click-result">จำนวนการคลิก: <strong>0</strong></p>
    </div>

    <!-- ทดสอบการรับค่า Input จากผู้ใช้ -->
    <div class="card">
        <h2>3. ทดสอบ Form & Input</h2>
        <input type="text" id="test-input" placeholder="ลองพิมพ์ข้อความอะไรสักอย่างที่นี่...">
        <button onclick="testInput()">แสดงข้อความ</button>
        <p id="input-result" style="margin-top: 15px; font-weight: bold; color: #28a745;"></p>
    </div>

    <!-- ทดสอบการทำงานแบบ Asynchronous (ดึงข้อมูลผ่านอินเทอร์เน็ต) -->
    <div class="card">
        <h2>4. ทดสอบ API Fetch (การดึงข้อมูล)</h2>
        <button onclick="fetchData()">ดึงข้อมูลผู้ใช้จำลอง (Mock API)</button>
        <pre id="api-result">รอกดปุ่มเพื่อโหลดข้อมูล...</pre>
    </div>

    <script>
        // ฟังก์ชันสลับ Dark Mode
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        // ฟังก์ชันนับจำนวนการคลิก
        let count = 0;
        function testClick() {
            count++;
            document.getElementById('click-result').innerHTML = `จำนวนการคลิก: <strong>${count}</strong>`;
        }

        // ฟังก์ชันแสดงข้อความจาก Input
        function testInput() {
            const text = document.getElementById('test-input').value;
            if(text.trim() === "") {
                document.getElementById('input-result').innerText = "คุณยังไม่ได้พิมพ์อะไรเลย!";
                document.getElementById('input-result').style.color = "#dc3545"; // สีแดง
            } else {
                document.getElementById('input-result').innerText = `คุณพิมพ์ว่า: "${text}"`;
                document.getElementById('input-result').style.color = "#28a745"; // สีเขียว
            }
        }

        // ฟังก์ชันดึงข้อมูลจาก API แบบ Asynchronous
        async function fetchData() {
            const resultEl = document.getElementById('api-result');
            resultEl.innerText = "กำลังโหลดข้อมูล... ⏳";
            
            try {
                // ใช้ JSONPlaceholder API สำหรับการทดสอบ
                const response = await fetch('https://jsonplaceholder.typicode.com/users/1');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                // แสดงผลลัพธ์เป็น JSON สวยงาม
                resultEl.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                resultEl.innerText = `❌ เกิดข้อผิดพลาด: ${error.message}`;
            }
        }
    </script>

</body>
</html>
